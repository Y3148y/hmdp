server:
  port: 8081
spring:
  application:
    name: hmdp
  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
        username: root
        password: MySQL901
        max-active: 20
        min-idle: 5
        connection-timeout: 30000
    sharding:
      tables:
        tb_voucher_order:
          actual-data-nodes: ds0.tb_voucher_order_$->{0..7}
          table-strategy:
            inline:
              sharding-column: id
              algorithm-expression: tb_voucher_order_$->{id % 8}
    props:
      sql:
        show: true
  redis:
    host: 192.168.119.128
    port: 6379
#    password: 123321
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        time-between-eviction-runs: 10s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 5
        max-concurrency: 20
    publisher-confirm-type: correlated
    publisher-returns: true
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  elasticsearch:
    host: localhost
    port: 9201
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  type-handlers-package: com.hmdp.handler
logging:
  level:
    com.hmdp: debug